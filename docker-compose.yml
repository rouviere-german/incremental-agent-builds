# Local stack for the build service. Only locally built images; nothing is pulled at runtime
# besides the pinned bases in the Dockerfile.
#
# The engine needs a writable store, so the read-only root filesystem is paired with one named
# volume at /var/lib/iab (traces, CAS, audit log, approvals, generated site). Everything else the
# process touches is a tmpfs.
services:
  app:
    build:
      context: .
    image: incremental-agent-builds:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENVIRONMENT: prod
      APP_LOG_LEVEL: INFO
      # Comma-separated SHA-256 digests, for /metrics. Generate with `uv run iab generate-api-key`.
      APP_API_KEY_SHA256: ${APP_API_KEY_SHA256:-}
      # Required for the scoped build routes: without it they answer 503 rather than run
      # unauthenticated. At least 32 bytes.
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      # Ed25519 seed for signing exported cache entries, and the peers whose entries may be
      # imported. Generate with `uv run iab keygen`.
      APP_CACHE_SIGNING_SEED: ${APP_CACHE_SIGNING_SEED:-}
      APP_CACHE_TRUSTED_KEYS: ${APP_CACHE_TRUSTED_KEYS:-}
      # Leave unset to run offline with the deterministic provider.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # A plan projected above this many micro-USD needs an approval before it executes.
      APP_PLAN_APPROVAL_USD_MICROS: ${APP_PLAN_APPROVAL_USD_MICROS:-250000}
      # The per-build budget. The step cap is raised above the application default of 50 because a
      # cold build of the reference workspace does not fit under it: `iab init` (seed 7, 80 modules)
      # followed by one build executes 287 rules and 81 LLM steps, and a build that crosses the cap
      # aborts with "budget exhausted" rather than finishing. Measured inside this image with the
      # offline deterministic provider (no ANTHROPIC_API_KEY) and the caps lifted, by running
      # `python -m incremental_agent_builds init` then `... build` against the mounted volume:
      #   executed 287, llm_steps 81, tokens 61692, usd_micros 465220, duration 2.78s
      # The token and USD caps are left at the application defaults: those, not the step count, are
      # what bounds real spend, so raising only the step cap does not widen the money guard.
      APP_BUDGET_MAX_STEPS: ${APP_BUDGET_MAX_STEPS:-200}
      APP_BUDGET_MAX_TOKENS: ${APP_BUDGET_MAX_TOKENS:-200000}
      APP_BUDGET_MAX_USD: ${APP_BUDGET_MAX_USD:-1.0}
      APP_BUILD_JOBS: "4"
      # Rules must not read outside BuildContext. Counted, not fatal, and it has to stay that way
      # for now: `strict` fails every module_outline rule in this image, because the engine's own
      # CAS write after a tool or LLM step happens outside io_permit() and is recorded against the
      # rule that triggered it (644 per cold build: 161 os.mkdir + 161 os.rename + 322 open, every
      # detail a path under store/cas). Those are the engine's writes, not the rules' reads.
      APP_BUILD_GUARD_MODE: warn
    volumes:
      - iab-store:/var/lib/iab
    read_only: true
    tmpfs:
      # The AST worker subprocesses and atomic writes need a small scratch area.
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 2.0
    restart: unless-stopped

volumes:
  iab-store:
